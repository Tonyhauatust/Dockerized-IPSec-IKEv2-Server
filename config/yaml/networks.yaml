networks:
  l2tp-server-network:
    name: l2tp-server-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
      com.docker.network.bridge.name: l2tp-server
    ipam:
      driver: default
      config:
        - subnet: 192.168.80.0/24
          gateway: 192.168.80.1
  ipsec-server-network:
    name: ipsec-server-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
      com.docker.network.bridge.name: ipsec-server
    ipam:
      driver: default
      config:
        - subnet: 192.168.81.0/24
          gateway: 192.168.81.1