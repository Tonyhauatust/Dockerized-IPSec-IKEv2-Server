config setup
    charondebug=""  # disable debug logging in production for lower CPU overhead
    uniqueids=no


# Here left means the VPN server, and right means the VPN client. 
# The left side is the side that is listening for incoming connections, 
# and the right side is the side that is initiating the connection.
conn host-to-server-tony-hau-1
    dpdaction=clear
    dpddelay=6h
    dpdtimeout=1800s
    type=tunnel
    keyexchange=ikev2
    mobike=yes

    left=192.168.81.2
    leftid=@tonyhauprivatevpnserver
    leftsubnet=0.0.0.0/0 # All traffic from the VPN client will be routed through the VPN server
    leftauth=psk

    right=%any
    rightid=tonyhau1@hahaha.com
    rightauth=psk
    rightsourceip=172.20.0.1/24 
    rightsubnet=172.20.0.0/24 # Only those IP addresses in this range will 
                                # be routed back to the client from the VPN server
    rightdns=8.8.8.8

    # Essentially allowing 
    ike=aes256gcm16-prfsha512-ecp521,aes256gcm16-prfsha512-ecp384,aes256gcm16-prfsha512-ecp256,aes256gcm16-prfsha512-modp4096,aes256gcm16-prfsha512-modp3072,aes256gcm16-prfsha512-modp2048,aes256-sha512-ecp521,aes256-sha512-ecp384,aes256-sha512-ecp256,aes256-sha512-modp4096,aes256-sha512-modp3072,aes256-sha256-modp2048,aes128-sha256-modp2048
    esp=aes256gcm16,aes128gcm16,aes256-sha512,aes256-sha256,aes128-sha256

    auto=add # Wait for incoming connections, but do not initiate any outgoing connections

