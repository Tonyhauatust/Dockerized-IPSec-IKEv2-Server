conn windows11-client-1
    dpdaction=clear
    dpddelay=8h
    dpdtimeout=1800s
    type=tunnel
    keyexchange=ikev2
    mobike=yes

    left=192.168.81.2
    leftid=@tonyhauprivatevpnserver
    leftsubnet=0.0.0.0/0 # All traffic from the VPN client will be routed through the VPN server
    leftcert=myvpnservercert.crt
    leftauth = pubkey-ecdsa-384-sha384
    leftca="CN=203.0.113.1"

    right=%any
    rightid=%any          # Windows sends its machine FQDN, not a fixed string
    rightauth=eap-mschapv2 # username + password authentication
    eap_identity=%any      # accept any EAP username
    rightsourceip=172.22.0.1/24
    rightsubnet=172.22.0.0/24 # Only those IP addresses in this range will 
                                # be routed back to the client from the VPN server
    rightdns=8.8.8.8

    ike = aes256gcm16-prfsha384-ecp384
    esp = aes256gcm16-ecp384

    

    auto=add # Wait for incoming connections, but do not initiate any outgoing connections
